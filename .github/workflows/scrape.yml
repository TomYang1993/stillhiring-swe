name: scrape
on:
  schedule: [{cron: "17 */4 * * *"}]  # every 4h
  workflow_dispatch:
permissions: {contents: write}
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scrape.py test && python scrape.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs/*.json
          git diff --cached --quiet || { git commit -m "data: $(date -u +%FT%TZ)" && git push; }
